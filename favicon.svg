<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b7cff"/>
      <stop offset="0.55" stop-color="#5a4bdc"/>
      <stop offset="1" stop-color="#8b3fd1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e6ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1a1060" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <!-- open book -->
    <path d="M256 394 C 226 366 182 356 138 360 L138 262 C 182 258 226 268 256 296 Z" fill="url(#page)"/>
    <path d="M256 394 C 286 366 330 356 374 360 L374 262 C 330 258 286 268 256 296 Z" fill="url(#page)"/>
    <path d="M256 296 L256 394" stroke="#9aa2ff" stroke-width="5" stroke-linecap="round"/>
    <!-- headphones -->
    <path d="M104 292 V248 C104 164 168 104 256 104 C344 104 408 164 408 248 V292" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
    <rect x="72" y="262" width="62" height="118" rx="31" fill="#ffffff"/>
    <rect x="378" y="262" width="62" height="118" rx="31" fill="#ffffff"/>
  </g>
  <!-- sound waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-opacity="0.85">
    <path d="M222 214 C 238 200 274 200 290 214" stroke-width="14"/>
    <path d="M200 182 C 228 156 284 156 312 182" stroke-width="14" stroke-opacity="0.55"/>
  </g>
</svg>
